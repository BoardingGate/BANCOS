<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Bancario Pro</title>
    <!-- Google Fonts e Iconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Librería PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-primary: #0d0f1a; --bg-secondary: #12152b; --bg-input: rgba(0,0,0,0.25);
            --accent: #6366f1; --accent-light: #818cf8; --accent-glow: rgba(99,102,241,0.3);
            --teal: #06b6d4; --teal-light: #67e8f9; --emerald: #10b981; --amber: #f59e0b;
            --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-muted: #475569;
            --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.14);
            --danger: #ef4444; --radius: 6px; --transition: 0.15s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Inter', sans-serif; background: var(--bg-primary); 
            color: var(--text-primary); font-size: 12px; line-height: 1.4; 
            overflow-x: hidden; min-height: 100vh;
        }

        /* HEADER ULTRA COMPACTO (UNA SOLA LÍNEA) */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; gap: 12px;
            padding: 4px 12px; height: 42px;
            background: rgba(13,15,26,0.98); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-strong);
        }
        .header-left { display: flex; align-items: center; gap: 8px; min-width: max-content; }
        .app-title { font-size: 14px; font-weight: 800; background: linear-gradient(135deg,#6366f1,#06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .tab-nav { display: flex; gap: 2px; flex: 1; }
        .tab-btn { 
            background: transparent; border: none; color: var(--text-muted); 
            padding: 4px 10px; border-radius: var(--radius); cursor: pointer; 
            font-size: 11px; font-weight: 600; white-space: nowrap; transition: 0.2s;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        .tab-btn.active { background: rgba(99,102,241,0.15); color: var(--accent-light); box-shadow: inset 0 0 0 1px rgba(99,102,241,0.3); }

        .header-actions { display: flex; align-items: center; gap: 6px; }
        .header-group { display: flex; align-items: center; gap: 4px; }

        .btn { 
            display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; 
            border-radius: var(--radius); border: 1px solid transparent; cursor: pointer; 
            font-family: inherit; font-size: 10px; font-weight: 700; white-space: nowrap; 
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: rgba(6,182,212,0.1); color: var(--teal-light); border-color: rgba(6,182,212,0.3); }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border-strong); }
        .btn-danger { color: var(--danger); border-color: rgba(239,68,68,0.2); }

        /* CONTENIDO PRINCIPAL */
        .app-main { padding: 8px; }
        .section { display: none; }
        .section.active { display: block; }

        .table-scroll-wrapper {
            overflow: auto; max-height: calc(100vh - 65px);
            border: 1px solid var(--border); background: rgba(18,21,43,0.4); border-radius: 4px;
        }

        /* GRID DE SALDOS */
        .balance-grid { display: grid; min-width: max-content; }
        .grid-cell { border: 1px solid var(--border); padding: 6px; position: relative; }
        
        .header-corner { position: sticky; top: 0; left: 0; z-index: 50; background: #0d0f1a!important; }
        .nav-controls { display: flex; gap: 2px; }
        .nav-btn { width: 28px; height: 24px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; cursor: pointer; border-radius: 3px; font-size: 10px; }

        .header-company { position: sticky; top: 0; z-index: 40; min-height: 34px; display: flex; align-items: center; justify-content: center; }
        .header-bank { position: sticky; left: 0; z-index: 40; background: #1a1d2e; }
        
        .header-input { background: transparent; border: none; color: #fff; font-weight: 700; width: 100%; text-align: center; }
        .bank-input { min-height: 70px; font-size: 11px; color: #fff; background: rgba(0,0,0,0.2); border: none; width: 100%; resize: none; padding: 4px; }

        .balance-cell { min-width: 160px; }
        .field-input { background: var(--bg-input); border: 1px solid var(--border); color: #fff; font-size: 11px; padding: 2px 4px; border-radius: 3px; width: 100%; margin-bottom: 3px; }
        .field-calc { font-weight: 700; background: rgba(16,185,129,0.1); color: var(--emerald); border: 1px solid rgba(16,185,129,0.2); padding: 3px; border-radius: 3px; text-align: right; }
        
        .movements-list { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
        .movement-item { background: rgba(0,0,0,0.2); padding: 3px; border-radius: 3px; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .mov-row { display: flex; gap: 3px; align-items: center; }
        .mov-importe { background: transparent; border: none; border-bottom: 1px solid var(--border-strong); color: #fff; font-size: 10px; flex: 1; text-align: right; }

        /* TABLAS TRADICIONALES */
        .data-table { width: 100%; border-collapse: collapse; background: rgba(0,0,0,0.2); }
        .data-table th { background: rgba(99,102,241,0.1); padding: 6px; border: 1px solid var(--border); font-size: 10px; }
        .data-table td { border: 1px solid var(--border); padding: 3px; }
        .inv-input { background: transparent; border: none; color: #fff; width: 100%; padding: 2px; }

        /* MODALES */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: var(--bg-secondary); padding: 20px; border-radius: 8px; border: 1px solid var(--border-strong); min-width: 280px; text-align: center; }
        .hidden { display: none; }

        /* PDF FIXES */
        .pdf-mode .app-header, .pdf-mode .btn-add-mov, .pdf-mode .cell-toggle, .pdf-mode .btn-delete-row, .pdf-mode .btn-delete-col { display: none !important; }
        .pdf-mode { background: #fff !important; color: #000 !important; width: 100% !important; }
        .pdf-mode .table-scroll-wrapper { overflow: visible !important; max-height: none !important; width: max-content !important; }
        .pdf-mode .grid-cell { border: 1px solid #aaa !important; color: #000 !important; background: transparent !important; }
        .pdf-mode input, .pdf-mode textarea { color: #000 !important; background: transparent !important; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-left">
        <span style="font-size:18px">🏦</span>
        <h1 class="app-title">GESTIÓN</h1>
    </div>

    <nav class="tab-nav">
        <button class="tab-btn active" data-section="balances">Saldos</button>
        <button class="tab-btn" data-section="invoices">Facturas</button>
        <button class="tab-btn" data-section="taxes">Impuestos</button>
        <button class="tab-btn" data-section="notes">Notas</button>
    </nav>

    <div class="header-actions">
        <div id="actions-balances" class="header-group">
            <button class="btn btn-secondary" onclick="addBank()">+ Banco</button>
            <button class="btn btn-secondary" onclick="addCompany()">+ Empresa</button>
            <button class="btn btn-primary" onclick="downloadPDF('section-balances', 'Saldos')">PDF</button>
        </div>
        <div id="actions-invoices" class="header-group" style="display:none">
            <button class="btn btn-secondary" onclick="addInvoice()">+ Fila</button>
            <button class="btn btn-primary" onclick="downloadPDF('section-invoices', 'Facturas')">PDF</button>
        </div>
        <div id="actions-taxes" class="header-group" style="display:none">
            <button class="btn btn-secondary" onclick="addTaxCompany()">+ Empresa</button>
            <button class="btn btn-primary" onclick="downloadPDF('section-taxes', 'Impuestos')">PDF</button>
        </div>
        <div id="actions-notes" class="header-group" style="display:none">
            <button class="btn btn-primary" onclick="downloadPDF('section-notes', 'Notas')">PDF</button>
        </div>
        
        <div style="width:1px; height:16px; background:var(--border-strong); margin:0 4px"></div>
        <button class="btn btn-ghost btn-danger" onclick="clearAll()">🗑️</button>
        <span id="save-indicator" style="color:var(--emerald); opacity:0.3; font-size:14px">●</span>
    </div>
</header>

<main class="app-main">
    <!-- SECCIÓN SALDOS -->
    <section id="section-balances" class="section active">
        <div class="table-scroll-wrapper" id="wrapper-balances">
            <div id="grid-balances" class="balance-grid"></div>
        </div>
    </section>

    <!-- SECCIÓN FACTURAS -->
    <section id="section-invoices" class="section">
        <div class="table-scroll-wrapper">
            <table class="data-table">
                <thead>
                    <tr>
                        <th colspan="12">Meses (E-D)</th>
                        <th>Proveedor / Descripción</th>
                        <th>Importe</th>
                        <th>Banco</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="invoices-body"></tbody>
            </table>
        </div>
    </section>

    <!-- SECCIÓN IMPUESTOS -->
    <section id="section-taxes" class="section">
        <div class="table-scroll-wrapper">
            <table class="data-table" id="table-taxes" style="width:100%"></table>
        </div>
    </section>

    <!-- SECCIÓN NOTAS -->
    <section id="section-notes" class="section">
        <textarea id="notes-area" placeholder="Notas libres..." style="width:100%; min-height:80vh; background:rgba(0,0,0,0.2); color:#fff; border:1px solid var(--border-strong); padding:12px; font-family:monospace; font-size:13px; resize:none"></textarea>
    </section>
</main>

<!-- MODAL CONFIRMACIÓN -->
<div id="confirm-overlay" class="modal-overlay hidden">
    <div class="modal">
        <p id="confirm-message" style="margin-bottom:15px">¿Estás seguro?</p>
        <div style="display:flex; gap:8px; justify-content:center">
            <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn btn-primary" id="confirm-btn-ok">Confirmar</button>
        </div>
    </div>
</div>

<script>
'use strict';

const STORAGE_KEY = 'control_bancario_v3';
let data = {
    banks: ['Banco 1', 'Banco 2'],
    companies: ['Empresa 1', 'Empresa 2'],
    balances: {},
    movements: {},
    disabledCells: {},
    invoices: [],
    taxCompanies: ['Empresa A'],
    taxValues: {},
    notes: ''
};

// --- INICIO ---
document.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) data = JSON.parse(saved);
    
    setupTabs();
    renderAll();
    
    document.getElementById('notes-area').value = data.notes;
    document.getElementById('notes-area').addEventListener('input', (e) => {
        data.notes = e.target.value;
        save();
    });
});

function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    const ind = document.getElementById('save-indicator');
    ind.style.opacity = 1;
    setTimeout(() => ind.style.opacity = 0.3, 800);
}

// --- NAVEGACIÓN ---
function setupTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn, .section, .header-group').forEach(el => {
                el.classList.remove('active');
                if (el.classList.contains('section') || el.classList.contains('header-group')) el.style.display = 'none';
            });
            btn.classList.add('active');
            const target = btn.dataset.section;
            document.getElementById('section-' + target).style.display = 'block';
            document.getElementById('actions-' + target).style.display = 'flex';
        });
    });
}

// --- RENDERIZADO SALDOS ---
function renderBalances() {
    const container = document.getElementById('grid-balances');
    const nComp = data.companies.length;
    container.style.gridTemplateColumns = `200px repeat(${nComp}, 170px)`;
    
    let html = `<div class="grid-cell header-corner">
        <div class="nav-controls">
            <button class="nav-btn" onclick="navScroll('left')">◀</button>
            <button class="nav-btn" onclick="navScroll('up')">▲</button>
            <button class="nav-btn" onclick="navScroll('down')">▼</button>
            <button class="nav-btn" onclick="navScroll('right')">▶</button>
        </div>
    </div>`;

    data.companies.forEach((c, ci) => {
        html += `<div class="grid-cell header-company" style="background:#1e3a8a">
            <input class="header-input" value="${c}" oninput="updateCompName(${ci}, this.value)">
            <button onclick="deleteComp(${ci})" style="position:absolute;right:2px;background:none;border:none;color:white;cursor:pointer">×</button>
        </div>`;
    });

    data.banks.forEach((b, bi) => {
        html += `<div class="grid-cell header-bank">
            <textarea class="bank-input" oninput="updateBankName(${bi}, this.value)">${b}</textarea>
            <button onclick="deleteBank(${bi})" style="position:absolute;top:2px;right:2px;background:none;border:none;color:gray;cursor:pointer">×</button>
        </div>`;

        data.companies.forEach((_, ci) => {
            const key = `${bi}-${ci}`;
            const bal = data.balances[key] || { actual: '' };
            const isDisabled = data.disabledCells[key];
            const total = calcConciliado(bi, ci);

            html += `<div class="grid-cell balance-cell ${isDisabled ? 'cell-disabled' : ''}">
                <input type="checkbox" ${isDisabled ? '' : 'checked'} onchange="toggleCell('${key}')" style="position:absolute;top:2px;right:2px">
                <div style="${isDisabled ? 'display:none' : ''}">
                    <input class="field-input" placeholder="Saldo Actual" value="${formatNum(bal.actual)}" onblur="updateBalance('${key}', this.value)">
                    <div class="field-calc ${total < 0 ? 'calc-negative' : ''}">${formatNum(total)}</div>
                    <div class="movements-list">
                        ${(data.movements[key] || []).map((m, mi) => `
                            <div class="movement-item">
                                <div class="mov-row">
                                    <input class="mov-importe" value="${formatNum(m.val)}" onblur="updateMov('${key}', ${mi}, this.value)">
                                    <button onclick="delMov('${key}', ${mi})" style="border:none;background:none;color:red;font-size:9px">×</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="btn btn-ghost" onclick="addMov('${key}')" style="width:100%;margin-top:4px;padding:2px;font-size:9px">+ Mov</button>
                </div>
            </div>`;
        });
    });
    container.innerHTML = html;
}

// --- LÓGICA DE NEGOCIO ---
function updateCompName(i, v) { data.companies[i] = v; save(); }
function updateBankName(i, v) { data.banks[i] = v; save(); }
function updateBalance(key, v) { 
    if (!data.balances[key]) data.balances[key] = { actual: 0 };
    data.balances[key].actual = parseNum(v);
    save(); renderBalances();
}
function toggleCell(key) { data.disabledCells[key] = !data.disabledCells[key]; save(); renderBalances(); }
function addMov(key) { if(!data.movements[key]) data.movements[key]=[]; data.movements[key].push({val:0}); save(); renderBalances(); }
function updateMov(key, mi, v) { data.movements[key][mi].val = parseNum(v); save(); renderBalances(); }
function delMov(key, mi) { data.movements[key].splice(mi, 1); save(); renderBalances(); }

function addBank() { data.banks.push('Nuevo Banco'); save(); renderBalances(); }
function addCompany() { data.companies.push('Nueva Empresa'); save(); renderBalances(); }

function calcConciliado(bi, ci) {
    const key = `${bi}-${ci}`;
    const actual = data.balances[key]?.actual || 0;
    const movs = (data.movements[key] || []).reduce((acc, m) => acc + (m.val || 0), 0);
    return actual + movs;
}

// --- FACTURAS ---
function renderInvoices() {
    const body = document.getElementById('invoices-body');
    body.innerHTML = data.invoices.map((inv, i) => `
        <tr>
            <td colspan="12" style="text-align:center">
                ${[...Array(12)].map((_, m) => `<input type="checkbox" ${inv.meses[m] ? 'checked' : ''} onchange="data.invoices[${i}].meses[${m}]=this.checked;save()">`).join(' ')}
            </td>
            <td><input class="inv-input" value="${inv.desc}" oninput="data.invoices[${i}].desc=this.value;save()"></td>
            <td><input class="inv-input" value="${formatNum(inv.imp)}" onblur="data.invoices[${i}].imp=parseNum(this.value);save();renderInvoices()"></td>
            <td><input class="inv-input" value="${inv.banco}" oninput="data.invoices[${i}].banco=this.value;save()"></td>
            <td><button class="btn btn-danger" onclick="data.invoices.splice(${i},1);save();renderInvoices()">×</button></td>
        </tr>
    `).join('');
}
function addInvoice() { data.invoices.push({meses:Array(12).fill(false), desc:'', imp:0, banco:''}); save(); renderInvoices(); }

// --- IMPUESTOS ---
function renderTaxes() {
    const t = document.getElementById('table-taxes');
    const keys = ['IVA','IGIC','IRPF','M202','M349','Obs'];
    let html = `<thead><tr><th>Concepto</th>${data.taxCompanies.map((c, i) => `<th><input class="header-input" value="${c}" oninput="data.taxCompanies[${i}]=this.value;save()"></th>`).join('')}</tr></thead><tbody>`;
    keys.forEach(k => {
        html += `<tr><td>${k}</td>${data.taxCompanies.map((_, ci) => `<td><input class="inv-input" style="text-align:right" value="${k==='Obs'?(data.taxValues[k+ci]||''):formatNum(data.taxValues[k+ci])}" onblur="data.taxValues['${k+ci}']=(${k==='Obs'}?this.value:parseNum(this.value));save();renderTaxes()"></td>`).join('')}</tr>`;
    });
    t.innerHTML = html + '</tbody>';
}
function addTaxCompany() { data.taxCompanies.push('Nueva'); save(); renderTaxes(); }

// --- UTILIDADES ---
function formatNum(n) { return (n || n === 0) ? new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2 }).format(n) : ''; }
function parseNum(s) { return parseFloat(String(s).replace(/\./g, '').replace(',', '.')) || 0; }

function navScroll(dir) {
    const w = document.getElementById('wrapper-balances');
    if(dir==='left') w.scrollBy(-200, 0); if(dir==='right') w.scrollBy(200, 0);
    if(dir==='up') w.scrollBy(0, -200); if(dir==='down') w.scrollBy(0, 200);
}

function clearAll() {
    openModal('¿BORRAR TODO EL SISTEMA?', () => { localStorage.removeItem(STORAGE_KEY); location.reload(); });
}

function openModal(msg, cb) {
    document.getElementById('confirm-message').innerText = msg;
    document.getElementById('confirm-overlay').classList.remove('hidden');
    document.getElementById('confirm-btn-ok').onclick = cb;
}
function closeModal() { document.getElementById('confirm-overlay').classList.add('hidden'); }

function renderAll() { renderBalances(); renderInvoices(); renderTaxes(); }

// --- PDF ---
window.downloadPDF = function(id, name) {
    const el = document.getElementById(id);
    document.body.classList.add('pdf-mode');
    
    // Forzamos que la captura sea limpia y desde el origen 0
    const opt = {
        margin: 5,
        filename: `${name}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, scrollX: 0, scrollY: 0, x: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };

    html2pdf().set(opt).from(el).save().then(() => {
        document.body.classList.remove('pdf-mode');
    });
};
</script>

</body>
</html>
