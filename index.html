<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Control Bancario - Gestión Integral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* VARIABLES Y ESTILOS ORIGINALES */
    :root {
      --bg-primary:#0d0f1a;--bg-secondary:#12152b;--bg-input:rgba(0,0,0,0.25);
      --accent:#6366f1;--accent-light:#818cf8;--accent-glow:rgba(99,102,241,0.3);
      --teal:#06b6d4;--teal-light:#67e8f9;--emerald:#10b981;--amber:#f59e0b;
      --text-primary:#e2e8f0;--text-secondary:#94a3b8;--text-muted:#475569;
      --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);
      --danger:#ef4444;--radius:10px;--radius-sm:6px;--radius-lg:16px;
      --transition:0.18s ease;--shadow:0 4px 20px rgba(0,0,0,0.4);
      --shadow-lg:0 8px 40px rgba(0,0,0,0.55);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;font-size:13px;line-height:1.5;}
    body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 20%,rgba(99,102,241,0.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(6,182,212,0.06) 0%,transparent 50%);pointer-events:none;z-index:0}

    /* HEADER UNIFICADO EN UNA LÍNEA */
    .app-header{
      position:sticky;top:0;z-index:100;
      display:flex;align-items:center;justify-content:space-between;
      padding:6px 20px;
      background:rgba(13,15,26,0.95);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border-strong);
      height: 50px;
    }
    .header-left{display:flex;align-items:center;gap:12px}
    .logo-icon{font-size:22px;filter:drop-shadow(0 0 10px rgba(99,102,241,0.5))}
    .app-title{font-size:16px;font-weight:700;background:linear-gradient(135deg,#6366f1,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

    .tab-nav{display:flex;gap:4px;margin-left:20px;flex:1}
    .tab-btn{background:transparent;border:none;color:var(--text-muted);padding:6px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:500;transition:all var(--transition);white-space:nowrap}
    .tab-btn:hover{background:rgba(255,255,255,0.04);color:var(--text-primary)}
    .tab-btn.active{background:rgba(99,102,241,0.2);color:var(--accent-light);border:1px solid rgba(99,102,241,0.3)}

    .header-right{display:flex;align-items:center;gap:10px}
    .context-buttons{display:flex;align-items:center;gap:8px}
    .save-indicator{font-size:11px;color:var(--text-muted);transition:color var(--transition)}
    .save-indicator.saved{color:var(--emerald)}

    .app-main{position:relative;z-index:1;padding:15px}
    .section{display:none}
    .section.active{display:block;animation:fadeIn 0.2s ease}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

    /* BOTONES */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid transparent;cursor:pointer;font-family:inherit;font-size:11px;font-weight:600;transition:all var(--transition);white-space:nowrap}
    .btn-primary{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}
    .btn-secondary{background:rgba(6,182,212,0.1);color:var(--teal-light);border-color:rgba(6,182,212,0.3)}
    .btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-strong)}
    .btn-ghost:hover{background:rgba(255,255,255,0.04);color:var(--text-primary)}

    /* TABLAS Y GRIDS ORIGINALES */
    .table-scroll-wrapper{
      overflow:auto;max-height:calc(100vh - 100px);
      position:relative;border-radius:var(--radius);border:1px solid var(--border);
      background:rgba(18,21,43,0.6);backdrop-filter:blur(8px);
    }
    .balance-grid{display:grid;min-width:max-content}
    .grid-cell{border:1px solid var(--border); border-bottom:var(--row-border, 1px solid var(--border)); padding:10px;}

    /* HEADER CORNER CON NAV COMPACTA */
    .header-corner { position: sticky; top: 0; left: 0; z-index: 50; display: flex; align-items: center; justify-content: center; min-height: 40px; padding: 4px; background: #0d0f1a !important; }
    .nav-controls { display: flex; flex-direction: row; gap: 4px; }
    .nav-btn { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 4px; cursor: pointer; width: 34px; height: 28px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
    .nav-btn:hover { background: rgba(99,102,241,0.6); }

    .header-company{ position:sticky; top:0; z-index:40; display:flex;align-items:center;justify-content:center;min-height:48px; }
    .header-bank{ position:sticky; left:0; z-index:40; display:flex;align-items:flex-start; }
    .header-editable-wrapper{display:flex;align-items:flex-start;gap:6px;width:100%}
    .header-input{background:transparent;border:none;border-bottom:1px solid transparent;color:#fff;font-family:inherit;font-size:13px;font-weight:600;padding:3px 4px;width:100%;text-align:center;}
    
    .bank-input{ resize: vertical; min-height: 110px; text-align: left; white-space: pre-wrap; font-size: 12px; padding: 6px; background: rgba(0,0,0,0.15); border-radius: 4px; color: #fff; border:none; width:100%;}
    
    .balance-cell{ background-color: var(--cell-bg, rgba(18,21,43,0.5)); min-width: 170px; position:relative; display:flex; flex-direction:column; }
    .cell-toggle { position: absolute; top: 6px; right: 6px; z-index: 20; cursor: pointer; background: rgba(0,0,0,0.3); padding: 2px; border-radius: 4px; display: flex; }
    .cell-disabled { background: #030408 !important; border: 1px dashed rgba(255,255,255,0.08) !important; }
    .cell-disabled .cell-content { display: none; }

    .field-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;padding-left:2px}
    .label-actual{color:rgba(6,182,212,0.8)}.label-punteado{color:rgba(139,92,246,0.8)}.label-conciliado{color:rgba(16,185,129,0.8)}.label-otra{color:rgba(245,158,11,0.8)}
    .field-input{background:var(--bg-input);border:1px solid var(--border);border-radius:4px;color:var(--text-primary);font-family:inherit;font-size:11px;padding:4px 6px;width:100%}
    .field-calc{background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-left:2px solid rgba(16,185,129,0.5);border-radius:4px;color:var(--emerald);padding:4px 6px;font-weight:700;min-height:28px;text-align:right}
    .calc-negative{color:#ef4444;border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.06)}

    .movements-divider{font-size:10px;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-strong);margin:12px 0 6px;padding-bottom:4px;font-weight:600}
    .movement-item{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:6px;padding:6px;margin-bottom:5px}
    .mov-importe{width:100%;background:var(--bg-input);border:1px solid var(--border);color:white;font-size:11px;padding:3px;text-align:right}
    
    .data-table{width:100%;border-collapse:collapse;font-size:12px;}
    .data-table th{background:rgba(99,102,241,0.1);color:var(--text-secondary);font-size:10px;padding:8px;border:1px solid var(--border);}
    .data-table td{border:1px solid var(--border);padding:4px;}

    .notes-textarea{width:100%;min-height:calc(100vh - 120px);background:rgba(18,21,43,0.8);border:1px solid var(--border-strong);border-radius:var(--radius);color:var(--text-primary);padding:20px;font-family:monospace;resize:none}

    /* REGLAS PDF PARA ELIMINAR DESPLAZAMIENTOS */
    .pdf-mode, .pdf-mode body { background: #fff !important; color: #000 !important; margin: 0 !important; padding: 0 !important; }
    .pdf-mode .app-header, .pdf-mode .btn-add-mov, .pdf-mode .cell-toggle, .pdf-mode .nav-controls, .pdf-mode .btn-delete-row, .pdf-mode .btn-delete-col { display: none !important; }
    .pdf-mode .table-scroll-wrapper { overflow: visible !important; max-height: none !important; width: max-content !important; border: none !important; }
    .pdf-mode .grid-cell { border: 1px solid #aaa !important; }
    .pdf-mode .field-input, .pdf-mode .bank-input { color: #000 !important; background: transparent !important; border-bottom: 1px solid #ccc !important; }
    
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;z-index:1000}
    .modal{background:var(--bg-secondary);border-radius:var(--radius-lg);padding:20px;min-width:300px;border:1px solid var(--border-strong)}
    .hidden{display:none}
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="logo-icon">🏦</div>
    <h1 class="app-title">Bancos</h1>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-section="balances">Saldos y Movimientos</button>
    <button class="tab-btn" data-section="invoices">Facturas</button>
    <button class="tab-btn" data-section="taxes">Impuestos</button>
    <button class="tab-btn" data-section="notes">Notas</button>
  </nav>

  <div class="header-right">
    <div class="context-buttons">
        <!-- BOTONES CONTEXTUALES (Se controlan por JS) -->
        <div id="ctx-balances" class="ctx-group">
            <button class="btn btn-ghost" onclick="downloadPDF('section-balances', 'Saldos')">PDF</button>
            <button class="btn btn-secondary" id="btn-add-bank">+ Banco</button>
            <button class="btn btn-primary" id="btn-add-company">+ Empresa</button>
        </div>
        <div id="ctx-invoices" class="ctx-group" style="display:none">
            <button class="btn btn-ghost" onclick="downloadPDF('section-invoices', 'Facturas')">PDF</button>
            <button class="btn btn-primary" id="btn-add-invoice">+ Fila</button>
        </div>
        <div id="ctx-taxes" class="ctx-group" style="display:none">
            <button class="btn btn-ghost" onclick="downloadPDF('section-taxes', 'Impuestos')">PDF</button>
            <button class="btn btn-primary" id="btn-add-tax-company">+ Empresa</button>
        </div>
        <div id="ctx-notes" class="ctx-group" style="display:none">
            <button class="btn btn-ghost" onclick="downloadPDF('section-notes', 'Notas')">PDF</button>
            <button class="btn btn-ghost" id="btn-clear-notes">Limpiar</button>
        </div>
    </div>
    
    <div style="width: 1px; height: 20px; background: var(--border-strong); margin: 0 5px;"></div>
    <span class="save-indicator" id="save-indicator">✓ Guardado</span>
    <button class="btn btn-ghost btn-danger" id="btn-clear" style="padding: 5px;" title="Borrar todo">🗑️</button>
  </div>
</header>

<main class="app-main">
  <!-- SECCION SALDOS -->
  <section id="section-balances" class="section active">
    <div class="table-scroll-wrapper" id="wrapper-balances">
      <div id="grid-balances" class="balance-grid"></div>
    </div>
    <div class="legend" style="display:flex; gap:15px; font-size:10px; margin-top:10px; opacity:0.6">
        <span><b style="color:var(--teal)">●</b> Saldo Actual</span>
        <span><b style="color:var(--accent-light)">●</b> Punteado</span>
        <span><b style="color:var(--emerald)">●</b> Conciliado (Auto)</span>
    </div>
  </section>

  <!-- SECCION FACTURAS -->
  <section id="section-invoices" class="section">
    <div class="table-scroll-wrapper">
      <table class="data-table" id="table-invoices">
        <thead>
          <tr>
            <th colspan="12">Meses (E-D)</th>
            <th>Descripción / Proveedor</th>
            <th>Cód. Contable</th>
            <th>Importe</th>
            <th>Banco</th>
            <th>Tipo</th>
            <th>Obs</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="invoices-body"></tbody>
      </table>
    </div>
  </section>

  <!-- SECCION IMPUESTOS -->
  <section id="section-taxes" class="section">
    <div class="table-scroll-wrapper">
      <table class="data-table" id="table-taxes"></table>
    </div>
  </section>

  <!-- SECCION NOTAS -->
  <section id="section-notes" class="section">
    <textarea id="notes-area" class="notes-textarea" placeholder="Escribe aquí tus anotaciones libremente..."></textarea>
  </section>
</main>

<div id="confirm-overlay" class="modal-overlay hidden">
  <div class="modal">
    <p id="confirm-message" style="margin-bottom:20px">¿Estás seguro?</p>
    <div style="display:flex; justify-content:flex-end; gap:10px">
        <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
        <button class="btn btn-primary" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<script>
'use strict';

// --- CONFIGURACION Y ESTADO ---
const STORAGE_KEY = 'banking-control-v2';
const MONTH_LABELS = ['E','F','M','A','M','J','J','A','S','O','N','D'];
const TAX_KEYS = ['iva','igic','irpf','mod202','mod349','obs'];
const TAX_ROWS = ['IVA','IGIC','IRPF','Mod. 202','Mod. 349','Observaciones'];

let data = {
  banks: ['Banco 1','Banco 2','Banco 3'],
  companies: ['Empresa 1','Empresa 2','Empresa 3'],
  balances: {}, movements: {}, disabledCells: {},
  invoices: [], taxCompanies: ['Empresa A'],
  taxValues: {}, notes: ''
};

// --- PERSISTENCIA ---
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  const el = document.getElementById('save-indicator');
  el.classList.add('saved');
  setTimeout(() => el.classList.remove('saved'), 1500);
}
function loadData() {
  const s = localStorage.getItem(STORAGE_KEY);
  if (s) Object.assign(data, JSON.parse(s));
}

// --- FORMATEO ORIGINAL ---
function formatCurrency(n) {
  if (n === '' || n === null || n === undefined) return '';
  const v = parseFloat(n);
  if (isNaN(v)) return '';
  return new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v);
}
function parseCurrency(str) {
  if (!str) return '';
  str = String(str).trim();
  return parseFloat(str.replace(/\./g, '').replace(',', '.')) || 0;
}

function calcConciliado(bi, ci) {
  const key = bi+'-'+ci;
  const bal = data.balances[key] || {};
  const actual = parseFloat(bal.saldoActual) || 0;
  const movs = data.movements[key] || [];
  const pending = movs.filter(m => !m.conciliado).reduce((s,m) => s + (parseFloat(m.importe)||0), 0);
  return actual + pending;
}

function updateConciliado(bi, ci) {
  const el = document.getElementById('conc-'+bi+'-'+ci);
  if (!el) return;
  const val = calcConciliado(bi, ci);
  el.textContent = formatCurrency(val) || '0,00';
  el.className = 'field-calc ' + (val < 0 ? 'calc-negative' : '');
}

// --- GENERAR PDF (ARREGLO DE DESPLAZAMIENTO) ---
window.downloadPDF = function(sectionId, filename) {
  const section = document.getElementById(sectionId);
  window.scrollTo(0, 0);
  document.body.classList.add('pdf-mode');

  setTimeout(() => {
    const opt = {
      margin: 10,
      filename: `${filename}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { 
        scale: 2, 
        useCORS: true, 
        scrollX: 0, 
        scrollY: 0, 
        x: 0 // CRÍTICO: Fuerza origen en 0
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
    };
    html2pdf().set(opt).from(section).save().then(() => {
      document.body.classList.remove('pdf-mode');
    });
  }, 300);
};

// --- RENDER GRID PRINCIPAL ---
function renderBalances() {
  const g = document.getElementById('grid-balances');
  const nc = data.companies.length;
  g.style.gridTemplateColumns = '240px repeat('+nc+', minmax(170px,1fr))';
  
  const companyColors = ['#1e3a8a', '#064e3b', '#78350f', '#4c1d95', '#831843'];
  const bankColors = ['#0f766e', '#b45309', '#be123c', '#4338ca'];
  const faintColors = ['rgba(30,58,138,0.1)','rgba(6,78,59,0.1)','rgba(120,53,15,0.1)','rgba(76,29,149,0.1)','rgba(131,24,67,0.1)'];

  let html = `<div class="grid-cell header-corner">
    <div class="nav-controls">
      <button class="nav-btn" onclick="navScroll('left')">◀</button>
      <button class="nav-btn" onclick="navScroll('up')">▲</button>
      <button class="nav-btn" onclick="navScroll('down')">▼</button>
      <button class="nav-btn" onclick="navScroll('right')">▶</button>
    </div>
  </div>`;

  data.companies.forEach((c, ci) => {
    html += `<div class="grid-cell header-company" style="background:${companyColors[ci%5]}">
      <div class="header-editable-wrapper">
        <input class="header-input company-input" data-ci="${ci}" value="${c}">
        <button class="btn-delete-col" onclick="confirmDelete('col', ${ci})">×</button>
      </div>
    </div>`;
  });

  data.banks.forEach((b, bi) => {
    const bCol = bankColors[bi%4];
    html += `<div class="grid-cell header-bank" style="background:${bCol}; --row-border: 5px solid ${bCol}">
      <div class="header-editable-wrapper">
        <textarea class="bank-input" data-bi="${bi}">${b}</textarea>
        <button class="btn-delete-row" onclick="confirmDelete('row', ${bi})">×</button>
      </div>
    </div>`;

    data.companies.forEach((_, ci) => {
      const key = bi+'-'+ci;
      const isDisabled = data.disabledCells[key];
      const bal = data.balances[key] || {};
      const cv = calcConciliado(bi, ci);

      html += `<div class="grid-cell balance-cell ${isDisabled?'cell-disabled':''}" style="--cell-bg:${faintColors[ci%5]}; --row-border: 5px solid ${bCol}">
        <label class="cell-toggle"><input type="checkbox" class="cell-activate-check" data-bi="${bi}" data-ci="${ci}" ${isDisabled?'':'checked'}></label>
        <div class="cell-content">
          <label class="field-label label-actual">Actual</label>
          <input class="field-input fmt-num" data-bi="${bi}" data-ci="${ci}" data-field="saldoActual" value="${formatCurrency(bal.saldoActual)}">
          
          <label class="field-label label-punteado">Punteado</label>
          <input class="field-input fmt-num" data-bi="${bi}" data-ci="${ci}" data-field="saldoPunteado" value="${formatCurrency(bal.saldoPunteado)}">
          
          <label class="field-label label-conciliado">Conciliado</label>
          <div class="field-calc ${cv<0?'calc-negative':''}" id="conc-${bi}-${ci}">${formatCurrency(cv)}</div>

          <div class="movements-divider">Pendientes</div>
          <div class="movs-container">
            ${(data.movements[key] || []).map((m, mi) => `
              <div class="movement-item ${m.conciliado?'mov-conciliado':''}">
                <input class="mov-importe fmt-num" data-bi="${bi}" data-ci="${ci}" data-mi="${mi}" data-field="importe" value="${formatCurrency(m.importe)}">
                <input type="text" class="field-input" data-bi="${bi}" data-ci="${ci}" data-mi="${mi}" data-field="observacion" value="${m.observacion||''}" placeholder="Obs..." style="font-size:9px; margin-top:2px">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:3px">
                    <label style="font-size:9px"><input type="checkbox" class="mov-conciliado-check" data-bi="${bi}" data-ci="${ci}" data-mi="${mi}" ${m.conciliado?'checked':''}> OK</label>
                    <button onclick="deleteMov(${bi},${ci},${mi})" style="color:red; background:none; border:none; cursor:pointer">×</button>
                </div>
              </div>
            `).join('')}
          </div>
          <button class="btn btn-secondary" style="width:100%; font-size:9px; padding:2px" onclick="addMov(${bi},${ci})">+ Movimiento</button>
        </div>
      </div>`;
    });
  });
  g.innerHTML = html;
}

// --- LOGICA DE EVENTOS ---
function setupEvents() {
  // Navegación de pestañas
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn, .section, .ctx-group').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.section, .ctx-group').forEach(el => el.style.display = 'none');
      
      btn.classList.add('active');
      const target = btn.dataset.section;
      document.getElementById('section-'+target).classList.add('active');
      document.getElementById('ctx-'+target).style.display = 'flex';
    });
  });

  // Inputs del Grid
  document.getElementById('grid-balances').addEventListener('change', e => {
    const el = e.target;
    const bi = el.dataset.bi, ci = el.dataset.ci, key = bi+'-'+ci;

    if (el.classList.contains('cell-activate-check')) {
      data.disabledCells[key] = !el.checked;
      saveData(); renderBalances();
    }
    if (el.classList.contains('mov-conciliado-check')) {
      data.movements[key][el.dataset.mi].conciliado = el.checked;
      saveData(); updateConciliado(bi, ci);
    }
  });

  document.getElementById('grid-balances').addEventListener('focusout', e => {
    const el = e.target;
    if (el.classList.contains('fmt-num')) {
      const val = parseCurrency(el.value);
      const bi = el.dataset.bi, ci = el.dataset.ci, key = bi+'-'+ci;
      
      if (el.dataset.mi !== undefined) {
        data.movements[key][el.dataset.mi].importe = val;
      } else {
        if (!data.balances[key]) data.balances[key] = {};
        data.balances[key][el.dataset.field] = val;
      }
      el.value = formatCurrency(val);
      saveData(); updateConciliado(bi, ci);
    }
  });

  // Botones añadir
  document.getElementById('btn-add-bank').onclick = () => { data.banks.push('Nuevo Banco'); saveData(); renderBalances(); };
  document.getElementById('btn-add-company').onclick = () => { data.companies.push('Nueva Empresa'); saveData(); renderBalances(); };
  document.getElementById('btn-clear').onclick = () => {
    if(confirm('¿BORRAR TODO?')) { localStorage.removeItem(STORAGE_KEY); location.reload(); }
  };
}

function addMov(bi, ci) {
  const key = bi+'-'+ci;
  if (!data.movements[key]) data.movements[key] = [];
  data.movements[key].push({importe: 0, conciliado: false, observacion: ''});
  saveData(); renderBalances();
}
function deleteMov(bi, ci, mi) {
  data.movements[bi+'-'+ci].splice(mi, 1);
  saveData(); renderBalances();
}

// (Otras funciones de render para Invoices y Taxes simplificadas para este ejemplo pero manteniendo tu estructura)
function renderInvoices() {
    const body = document.getElementById('invoices-body');
    body.innerHTML = data.invoices.map((inv, i) => `
        <tr>
            <td colspan="12">${MONTH_LABELS.map((m, mi) => `<input type="checkbox" ${inv.meses?.[mi]?'checked':''} onchange="updateInvMes(${i}, ${mi}, this.checked)">`).join('')}</td>
            <td><input class="field-input" value="${inv.desc||''}" oninput="data.invoices[${i}].desc=this.value;saveData()"></td>
            <td><input class="field-input" value="${inv.cta||''}" oninput="data.invoices[${i}].cta=this.value;saveData()"></td>
            <td><input class="field-input fmt-num" value="${formatCurrency(inv.imp)}" onblur="data.invoices[${i}].imp=parseCurrency(this.value);saveData();this.value=formatCurrency(parseCurrency(this.value))"></td>
            <td><input class="field-input" value="${inv.bank||''}" oninput="data.invoices[${i}].bank=this.value;saveData()"></td>
            <td><input class="field-input" value="${inv.tipo||''}" oninput="data.invoices[${i}].tipo=this.value;saveData()"></td>
            <td><input class="field-input" value="${inv.obs||''}" oninput="data.invoices[${i}].obs=this.value;saveData()"></td>
            <td><button onclick="data.invoices.splice(${i},1);saveData();renderInvoices()">×</button></td>
        </tr>
    `).join('');
}
document.getElementById('btn-add-invoice').onclick = () => { data.invoices.push({meses:[], desc:'', imp:0}); saveData(); renderInvoices(); };

function navScroll(dir) {
    const el = document.getElementById('wrapper-balances');
    if(dir==='left') el.scrollBy(-250, 0);
    if(dir==='right') el.scrollBy(250, 0);
    if(dir==='up') el.scrollBy(0, -250);
    if(dir==='down') el.scrollBy(0, 250);
}

// --- INICIO ---
window.onload = () => {
  loadData();
  renderBalances();
  renderInvoices();
  // renderTaxes();
  setupEvents();
  document.getElementById('notes-area').value = data.notes;
  document.getElementById('notes-area').oninput = (e) => { data.notes = e.target.value; saveData(); };
};
</script>
