<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Control Bancario Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <!-- Librería para PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<header class="app-header">
  <div class="header-left">
    <div class="logo-icon">&#x1F3E6;</div>
    <nav class="tab-nav">
      <button class="tab-btn active" data-section="balances">Saldos</button>
      <button class="tab-btn" data-section="invoices">Facturas</button>
      <button class="tab-btn" data-section="taxes">Impuestos</button>
      <button class="tab-btn" data-section="notes">Notas</button>
    </nav>
  </div>

  <div class="header-right">
    <!-- Acciones dinámicas según pestaña -->
    <div id="actions-balances" class="tab-actions">
      <button class="btn btn-secondary" id="btn-add-bank">+ Banco</button>
      <button class="btn btn-primary" id="btn-add-company">+ Empresa</button>
      <button class="btn btn-ghost" onclick="downloadPDF('section-balances', 'Saldos')">&#x1F4BE; PDF</button>
    </div>
    <div id="actions-invoices" class="tab-actions hidden">
      <button class="btn btn-primary" id="btn-add-invoice">+ Fila</button>
      <button class="btn btn-ghost" onclick="downloadPDF('section-invoices', 'Facturas')">&#x1F4BE; PDF</button>
    </div>
    <div id="actions-taxes" class="tab-actions hidden">
      <button class="btn btn-primary" id="btn-add-tax-company">+ Empresa</button>
      <button class="btn btn-ghost" onclick="downloadPDF('section-taxes', 'Impuestos')">&#x1F4BE; PDF</button>
    </div>
    <div id="actions-notes" class="tab-actions hidden">
      <button class="btn btn-ghost" id="btn-clear-notes">Limpiar Notas</button>
      <button class="btn btn-ghost" onclick="downloadPDF('section-notes', 'Notas')">&#x1F4BE; PDF</button>
    </div>

    <div class="header-divider"></div>
    <span class="save-indicator" id="save-indicator">Sincronizado</span>
    <button class="btn btn-danger" id="btn-clear" title="BORRAR TODO">&#x1F5D1;</button>
  </div>
</header>

<main class="app-main">
  <section id="section-balances" class="section active">
    <div class="table-scroll-wrapper" id="wrapper-balances">
      <div id="grid-balances" class="balance-grid"></div>
    </div>
  </section>

  <section id="section-invoices" class="section">
    <div class="table-scroll-wrapper">
      <table class="data-table" id="table-invoices">
        <thead>
          <tr>
            <th class="col-fit">E</th><th class="col-fit">F</th><th class="col-fit">M</th>
            <th class="col-fit">A</th><th class="col-fit">M</th><th class="col-fit">J</th>
            <th class="col-fit">J</th><th class="col-fit">A</th><th class="col-fit">S</th>
            <th class="col-fit">O</th><th class="col-fit">N</th><th class="col-fit">D</th>
            <th>Proveedor</th><th>Cuenta</th><th>Importe</th><th>Banco</th><th>Tipo</th><th class="col-expand">Observaciones</th><th></th>
          </tr>
        </thead>
        <tbody id="invoices-body"></tbody>
      </table>
    </div>
  </section>

  <section id="section-taxes" class="section">
    <div class="table-scroll-wrapper">
      <table class="data-table" id="table-taxes"></table>
    </div>
  </section>

  <section id="section-notes" class="section">
    <textarea id="notes-area" class="notes-textarea" placeholder="Escribe aquí tus notas..."></textarea>
  </section>
</main>

<div id="confirm-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header"><h3>Confirmar acción</h3></div>
    <div class="modal-body"><p id="confirm-message"></p></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
      <button class="btn btn-danger" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
