<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Control Bancario Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <span class="logo-icon">🏦</span>
    <h1 class="app-title">Bancos</h1>
  </div>

  <nav class="tab-nav">
    <button class="tab-btn active" data-section="balances">Saldos y Movs.</button>
    <button class="tab-btn" data-section="invoices">Facturas</button>
    <button class="tab-btn" data-section="taxes">Impuestos</button>
    <button class="tab-btn" data-section="notes">Notas</button>
  </nav>

  <div class="header-actions">
    <!-- Botones de contexto que cambian según la sección o se muestran/ocultan por JS -->
    <div id="context-actions-balances" class="header-group">
      <button class="btn btn-secondary" id="btn-add-bank">+ Banco</button>
      <button class="btn btn-secondary" id="btn-add-company">+ Empresa</button>
      <button class="btn btn-primary btn-export" onclick="downloadPDF('section-balances', 'Saldos')">PDF</button>
    </div>
    <div id="context-actions-invoices" class="header-group" style="display:none">
      <button class="btn btn-secondary" id="btn-add-invoice">+ Fila</button>
      <button class="btn btn-primary btn-export" onclick="downloadPDF('section-invoices', 'Facturas')">PDF</button>
    </div>
    <div id="context-actions-taxes" class="header-group" style="display:none">
      <button class="btn btn-secondary" id="btn-add-tax-company">+ Empresa</button>
      <button class="btn btn-primary btn-export" onclick="downloadPDF('section-taxes', 'Impuestos')">PDF</button>
    </div>
    <div id="context-actions-notes" class="header-group" style="display:none">
      <button class="btn btn-ghost" id="btn-clear-notes">Limpiar Notas</button>
      <button class="btn btn-primary btn-export" onclick="downloadPDF('section-notes', 'Notas')">PDF</button>
    </div>
    
    <div style="width: 1px; height: 20px; background: var(--border-strong); margin: 0 5px;"></div>
    <button class="btn btn-ghost btn-danger" id="btn-clear" title="Borrar todo">🗑️</button>
    <span id="save-indicator" class="save-indicator" style="font-size:10px; color:var(--emerald); opacity:0.7">●</span>
  </div>
</header>

<main class="app-main">
  <section id="section-balances" class="section active">
    <div class="table-scroll-wrapper" id="wrapper-balances">
      <div id="grid-balances" class="balance-grid"></div>
    </div>
  </section>

  <section id="section-invoices" class="section">
    <div class="table-scroll-wrapper">
      <table class="data-table" id="table-invoices">
        <thead>
          <tr>
            <th colspan="12">Meses</th>
            <th>Proveedor</th><th>Cta</th><th>Importe</th><th>Banco</th><th>Tipo</th><th>Obs</th><th></th>
          </tr>
        </thead>
        <tbody id="invoices-body"></tbody>
      </table>
    </div>
  </section>

  <section id="section-taxes" class="section">
    <div class="table-scroll-wrapper">
      <table class="data-table taxes-table" id="table-taxes" style="width:100%"></table>
    </div>
  </section>

  <section id="section-notes" class="section">
    <textarea id="notes-area" class="notes-textarea" style="width:100%; min-height:70vh; background:rgba(0,0,0,0.2); color:#fff; border:1px solid var(--border-strong); padding:15px; font-family:monospace; resize:none"></textarea>
  </section>
</main>

<div id="confirm-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-body"><p id="confirm-message">¿Confirmar?</p></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="confirm-cancel">No</button>
      <button class="btn btn-primary" id="confirm-ok">Sí</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
